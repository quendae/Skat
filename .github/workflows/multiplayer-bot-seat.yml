name: Shared server multiplayer smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check multiplayer client
        run: |
          node --check multiplayer-server.js
          grep -q 'graceBySeat' multiplayer-server.js
          grep -q "message.type === 'game.player.bot_takeover'" multiplayer-server.js
          grep -q 'graceCountdownText' multiplayer-server.js
          grep -q 'authoritative: false' multiplayer-server.js
          grep -q 'if (mp.authoritative) return' multiplayer-server.js
          grep -q "socketSend({ type: 'game.state.get', roomId: mp.room })" multiplayer-server.js

      - name: Install browser test driver
        run: npm install --no-save --no-package-lock playwright-core@1.55.0

      - name: Run shared server multiplayer smoke
        run: node tests/multiplayer_server_smoke.mjs
