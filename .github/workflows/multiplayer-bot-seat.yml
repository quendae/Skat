name: Hybrid multiplayer bot test

on:
  push:
    branches:
      - main
      - feature/multiplayer-bot-seat
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test driver
        run: npm install --no-save --no-package-lock playwright-core@1.55.0

      - name: Run hybrid multiplayer smoke agent
        run: node tests/multiplayer_bot_smoke.mjs
