name: Migrate multiplayer transport

on:
  push:
    paths:
      - '.github/workflows/migrate-multiplayer-server.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replace legacy WebRTC client
        run: node scripts/migrate-multiplayer-server.mjs
      - name: Verify migration markers
        run: |
          grep -q '<script src="./multiplayer-server.js"></script>' index.html
          ! grep -q 'const RTC_CONFIG' index.html
          grep -q 'wss://api.qqnd.fyi/api/v1/ws' multiplayer-server.js
      - name: Commit migrated index
        run: |
          if git diff --quiet; then
            echo 'No migration changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: migrate Skat multiplayer to QQND server [skip ci]'
          git push
