name: B2 presence client hardening

on:
  push:
    paths:
      - '.github/workflows/b2-presence-client-hardening.yml'
      - 'scripts/b2-presence-client-hardening.mjs'
      - 'scripts/b2-presence-client-hardening-v2.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply migration
        run: node scripts/b2-presence-client-hardening-v2.mjs
      - name: Verify syntax and smoke
        run: |
          node --check multiplayer-server.js
          npm install --no-save --no-package-lock playwright-core@1.55.0
          node tests/multiplayer_server_smoke.mjs
          grep -q 'multiplayer-server.js?v=20260906-b2p3' index.html
          grep -q "CLIENT_BUILD = '20260906-b2p3'" multiplayer-server.js
          grep -q "message.type === 'game.presence'" multiplayer-server.js
          ! grep -q "type: 'game.state.commit'" multiplayer-server.js
          ! grep -q "type: 'game.state.publish'" multiplayer-server.js
      - name: Commit generated changes
        run: |
          git checkout -- .github/workflows/multiplayer-bot-seat.yml
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html multiplayer-server.js tests/multiplayer_server_smoke.mjs
          git commit -m 'fix: harden authoritative presence and bot takeover UI [skip ci]'
          git push
